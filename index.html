<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collect Four - Ultimate Collect Four</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Exo+2:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Exo 2', 'Orbitron', sans-serif;
        }

        :root {
            --neon-pink: #ff00cc;
            --neon-blue: #00ccff;
            --neon-green: #00ffcc;
            --neon-purple: #cc00ff;
            --neon-orange: #ff3300;
            --neon-yellow: #ffcc00;
            --deep-space: #0a0a1f;
            --cosmic-purple: #1a1a3a;
            --stardust: #2a2a4a;
            --nebula-blue: #0f3460;
        }

        body {
            background: 
                radial-gradient(circle at 20% 80%, rgba(255, 0, 204, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 204, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(0, 255, 204, 0.05) 0%, transparent 50%),
                linear-gradient(135deg, var(--deep-space) 0%, var(--cosmic-purple) 50%, var(--nebula-blue) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 0, 204, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 204, 255, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 4s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .game-container {
            width: 100%;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            position: relative;
        }

        .cosmic-header {
            text-align: center;
            margin-bottom: 40px;
            width: 100%;
            position: relative;
        }

        .title-wrapper {
            position: relative;
            display: inline-block;
        }

        .main-title {
            font-size: 5rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-blue), var(--neon-green));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 
                0 0 30px rgba(255, 0, 204, 0.5),
                0 0 60px rgba(0, 204, 255, 0.3);
            margin-bottom: 10px;
            letter-spacing: 4px;
            position: relative;
            z-index: 2;
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from {
                text-shadow: 
                    0 0 30px rgba(255, 0, 204, 0.5),
                    0 0 60px rgba(0, 204, 255, 0.3);
            }
            to {
                text-shadow: 
                    0 0 40px rgba(255, 0, 204, 0.8),
                    0 0 80px rgba(0, 204, 255, 0.5),
                    0 0 120px rgba(0, 255, 204, 0.3);
            }
        }

        .title-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5.2rem;
            font-weight: 900;
            color: transparent;
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.1);
            z-index: 1;
            letter-spacing: 4px;
        }

        .subtitle {
            font-size: 1.4rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .main-content {
            display: flex;
            width: 100%;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }

        .game-board-container {
            flex: 1;
            min-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .board-frame {
            background: linear-gradient(145deg, 
                rgba(26, 26, 58, 0.9) 0%, 
                rgba(42, 42, 74, 0.9) 50%, 
                rgba(26, 26, 58, 0.9) 100%);
            padding: 30px;
            border-radius: 25px;
            position: relative;
            box-shadow: 
                0 0 50px rgba(255, 0, 204, 0.2),
                inset 0 0 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .board-frame::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-blue), var(--neon-green));
            border-radius: 27px;
            z-index: -1;
            opacity: 0.5;
            animation: borderGlow 3s ease-in-out infinite alternate;
        }

        @keyframes borderGlow {
            from { opacity: 0.3; }
            to { opacity: 0.7; }
        }

        .column-indicator {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        .column-number {
            width: 70px;
            text-align: center;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 0 0 10px rgba(100, 100, 255, 0.5);
            font-size: 1.1rem;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 12px;
            background: radial-gradient(circle at center, #1a1a3a, #0a0a1f);
            padding: 25px;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }

        .board::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(45deg, transparent 48%, rgba(255, 255, 255, 0.03) 50%, transparent 52%),
                linear-gradient(-45deg, transparent 48%, rgba(255, 255, 255, 0.03) 50%, transparent 52%);
            background-size: 30px 30px;
            animation: gridMove 20s linear infinite;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 30px 30px; }
        }

        .cell {
            width: 75px;
            height: 75px;
            background: radial-gradient(circle at 30% 30%, #2a2a4a, #1a1a3a);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 1;
            box-shadow: 
                inset 0 0 15px rgba(0, 0, 0, 0.8),
                0 5px 20px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cell::before {
            content: '';
            position: absolute;
            top: 5%;
            left: 5%;
            width: 90%;
            height: 90%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.1), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .cell:hover {
            transform: scale(1.08);
            box-shadow: 
                inset 0 0 20px rgba(100, 100, 255, 0.3),
                0 0 30px rgba(100, 100, 255, 0.4);
        }

        .cell:hover::before {
            opacity: 1;
        }

        .player-sidebar {
            flex: 0 0 380px;
            background: linear-gradient(145deg, 
                rgba(26, 26, 58, 0.95) 0%, 
                rgba(42, 42, 74, 0.95) 100%);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 
                0 0 40px rgba(255, 0, 204, 0.25),
                inset 0 0 30px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            position: relative;
            overflow: hidden;
        }

        .player-sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 0, 204, 0.05) 50%, transparent 70%);
            animation: sidebarShine 8s ease-in-out infinite;
        }

        @keyframes sidebarShine {
            0%, 100% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
        }

        .section-title {
            font-size: 1.8rem;
            color: var(--neon-pink);
            margin-bottom: 25px;
            text-align: center;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(255, 0, 204, 0.5);
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 25%;
            width: 50%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-pink), transparent);
        }

        .color-palette {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .color-option {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            border: 3px solid transparent;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .color-option::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--neon-pink), var(--neon-blue), var(--neon-green), var(--neon-purple), var(--neon-pink));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .color-option:hover {
            transform: scale(1.15) rotate(5deg);
            box-shadow: 0 0 30px currentColor;
        }

        .color-option.selected {
            border: 3px solid white;
            box-shadow: 
                0 0 25px white, 
                0 0 40px currentColor;
            animation: colorPulse 2s infinite;
            transform: scale(1.1);
        }

        .color-option.selected::before {
            opacity: 1;
            animation: rotate 3s linear infinite;
        }

        @keyframes colorPulse {
            0%, 100% { transform: scale(1.1); }
            50% { transform: scale(1.15); }
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .player-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .player-card {
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .player-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.03) 50%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .player-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .player-card:hover::before {
            opacity: 1;
        }

        .player-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-right: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .player-avatar::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--neon-pink), var(--neon-blue), var(--neon-green), var(--neon-purple), var(--neon-pink));
            z-index: -1;
            opacity: 0.7;
            animation: rotate 4s linear infinite;
        }

        .player-details {
            flex: 1;
        }

        .player-name {
            font-size: 1.4rem;
            margin-bottom: 8px;
            font-weight: 700;
            background: linear-gradient(45deg, #fff, #a0a0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .player-stats {
            display: flex;
            gap: 15px;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .btn {
            padding: 18px;
            border: none;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-purple));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(255, 0, 204, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-green));
            color: #0a0a1f;
        }

        .btn-secondary:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 204, 255, 0.4);
        }

        .game-status {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border-radius: 20px;
            margin-top: 25px;
            font-size: 1.3rem;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }

        .ai-intelligence {
            margin-top: 30px;
            text-align: center;
        }

        .intelligence-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .intelligence-bar-container {
            height: 25px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            margin-top: 15px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .intelligence-level {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-green));
            border-radius: 12px;
            width: 10%;
            transition: width 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .intelligence-level::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shine 2s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .intelligence-text {
            margin-top: 15px;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
        }

        .disc {
            width: 90%;
            height: 90%;
            border-radius: 50%;
            position: absolute;
            z-index: 2;
            box-shadow: 
                inset 0 0 15px rgba(0, 0, 0, 0.7),
                0 5px 20px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .falling {
            animation: drop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes drop {
            0% { 
                transform: translateY(-600px) rotate(0deg);
                opacity: 0;
            }
            70% { 
                transform: translateY(20px) rotate(180deg);
                opacity: 1;
            }
            100% { 
                transform: translateY(0) rotate(360deg);
            }
        }

        .winning {
            animation: winGlow 1.5s infinite alternate, winPulse 2s infinite;
        }

        @keyframes winGlow {
            from { 
                box-shadow: 
                    inset 0 0 20px rgba(0, 0, 0, 0.7),
                    0 0 30px currentColor;
            }
            to { 
                box-shadow: 
                    inset 0 0 20px rgba(0, 0, 0, 0.7),
                    0 0 50px currentColor,
                    0 0 70px currentColor;
            }
        }

        @keyframes winPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .particle {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
            filter: blur(1px);
        }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }

        @media (max-width: 1100px) {
            .main-content {
                flex-direction: column;
            }
            
            .game-board-container, .player-sidebar {
                width: 100%;
            }
            
            .board {
                min-width: unset;
                width: 100%;
            }
            
            .cell {
                width: 12vw;
                height: 12vw;
                max-width: 75px;
                max-height: 75px;
            }
        }

        .floating-element {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255, 0, 204, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(20px);
            animation: float 15s infinite ease-in-out;
            z-index: -1;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(50px, -30px) rotate(90deg); }
            50% { transform: translate(0, -60px) rotate(180deg); }
            75% { transform: translate(-50px, -30px) rotate(270deg); }
        }

        .victory-celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: none;
        }

        .confetti {
            position: absolute;
            width: 15px;
            height: 15px;
            opacity: 0;
        }

        .difficulty-selector {
            margin-bottom: 25px;
        }

        .difficulty-options {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .difficulty-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .difficulty-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .difficulty-btn.active {
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-purple));
            box-shadow: 0 0 15px rgba(255, 0, 204, 0.5);
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="game-container">
        <div class="cosmic-header">
            <div class="title-wrapper">
                <div class="title-bg">NOVA CONNECT</div>
                <h1 class="main-title">NOVA CONNECT</h1>
            </div>
            <p class="subtitle">The Ultimate Cosmic Collect Four Experience</p>
        </div>
        
        <div class="main-content">
            <div class="game-board-container">
                <div class="board-frame">
                    <div class="column-indicator">
                        <div class="column-number">1</div>
                        <div class="column-number">2</div>
                        <div class="column-number">3</div>
                        <div class="column-number">4</div>
                        <div class="column-number">5</div>
                        <div class="column-number">6</div>
                        <div class="column-number">7</div>
                    </div>
                    <div class="board" id="board">
                        <!-- Board cells will be generated by JavaScript -->
                    </div>
                </div>
                <div class="game-status" id="game-status">
                    <span>Select your cosmic color and begin the challenge!</span>
                </div>
            </div>
            
            <div class="player-sidebar">
                <h2 class="section-title">COSMIC CUSTOMIZATION</h2>
                
                <div class="color-palette" id="color-palette">
                    <div class="color-option selected" style="background-color: #ff00cc;" data-color="#ff00cc"></div>
                    <div class="color-option" style="background-color: #00ccff;" data-color="#00ccff"></div>
                    <div class="color-option" style="background-color: #00ffcc;" data-color="#00ffcc"></div>
                    <div class="color-option" style="background-color: #ffcc00;" data-color="#ffcc00"></div>
                    <div class="color-option" style="background-color: #cc00ff;" data-color="#cc00ff"></div>
                    <div class="color-option" style="background-color: #ff3300;" data-color="#ff3300"></div>
                </div>
                
                <div class="difficulty-selector">
                    <div class="section-title">AI DIFFICULTY</div>
                    <div class="difficulty-options">
                        <button class="difficulty-btn active" data-difficulty="easy">Easy</button>
                        <button class="difficulty-btn" data-difficulty="medium">Medium</button>
                        <button class="difficulty-btn" data-difficulty="hard">Hard</button>
                        <button class="difficulty-btn" data-difficulty="impossible">Impossible</button>
                    </div>
                </div>
                
                <div class="player-info">
                    <div class="player-card">
                        <div class="player-avatar" id="player-avatar" style="background-color: #ff00cc;">
                            <span>👨‍🚀</span>
                        </div>
                        <div class="player-details">
                            <div class="player-name">COSMIC EXPLORER</div>
                            <div class="player-stats">
                                <div class="stat">Wins: <span id="player-wins">0</span></div>
                                <div class="stat">Losses: <span id="player-losses">0</span></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="player-card">
                        <div class="player-avatar" id="robot-avatar" style="background-color: #3333ff;">
                            <span>🤖</span>
                        </div>
                        <div class="player-details">
                            <div class="player-name">NOVA AI</div>
                            <div class="player-stats">
                                <div class="stat">Wins: <span id="robot-wins">0</span></div>
                                <div class="stat">Level: <span id="ai-level">1</span></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="ai-intelligence">
                    <div class="intelligence-header">
                        <div class="section-title">AI INTELLIGENCE</div>
                    </div>
                    <div class="intelligence-bar-container">
                        <div class="intelligence-level" id="intelligence-level"></div>
                    </div>
                    <div class="intelligence-text" id="intelligence-text">NOVA is learning cosmic strategies... (10%)</div>
                </div>
                
                <div class="controls">
                    <button class="btn btn-primary" id="start-btn">BEGIN COSMIC BATTLE</button>
                    <button class="btn btn-secondary" id="reset-btn">RESET UNIVERSE</button>
                </div>
            </div>
        </div>
    </div>

    <div class="victory-celebration" id="victory-celebration"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Create starfield background
            createStarfield();
            
            // Create floating elements
            createFloatingElements();
            
            // Game elements
            const boardElement = document.getElementById('board');
            const gameStatusElement = document.getElementById('game-status');
            const startButton = document.getElementById('start-btn');
            const resetButton = document.getElementById('reset-btn');
            const playerAvatar = document.getElementById('player-avatar');
            const robotAvatar = document.getElementById('robot-avatar');
            const colorOptions = document.querySelectorAll('.color-option');
            const playerWinsElement = document.getElementById('player-wins');
            const playerLossesElement = document.getElementById('player-losses');
            const robotWinsElement = document.getElementById('robot-wins');
            const aiLevelElement = document.getElementById('ai-level');
            const intelligenceLevelElement = document.getElementById('intelligence-level');
            const intelligenceTextElement = document.getElementById('intelligence-text');
            const victoryCelebration = document.getElementById('victory-celebration');
            const difficultyButtons = document.querySelectorAll('.difficulty-btn');
            
            // Game state
            let gameActive = false;
            let playerColor = '#ff00cc';
            let robotColor = '#3333ff';
            let currentPlayer = 'player';
            let board = [];
            let playerWins = 0;
            let playerLosses = 0;
            let robotWins = 0;
            let aiLevel = 1;
            let aiIntelligence = 10;
            let difficulty = 'easy';
            
            // Create starfield background
            function createStarfield() {
                const starsContainer = document.getElementById('stars');
                for (let i = 0; i < 150; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.width = Math.random() * 3 + 'px';
                    star.style.height = star.style.width;
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.animationDelay = Math.random() * 4 + 's';
                    star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    starsContainer.appendChild(star);
                }
            }
            
            // Create floating background elements
            function createFloatingElements() {
                const container = document.querySelector('.game-container');
                for (let i = 0; i < 8; i++) {
                    const element = document.createElement('div');
                    element.className = 'floating-element';
                    element.style.left = Math.random() * 100 + '%';
                    element.style.top = Math.random() * 100 + '%';
                    element.style.background = `radial-gradient(circle, ${getRandomColor()} 0%, transparent 70%)`;
                    element.style.animationDelay = Math.random() * 15 + 's';
                    element.style.width = Math.random() * 150 + 50 + 'px';
                    element.style.height = element.style.width;
                    container.appendChild(element);
                }
            }
            
            function getRandomColor() {
                const colors = [
                    'rgba(255, 0, 204, 0.1)',
                    'rgba(0, 204, 255, 0.1)',
                    'rgba(0, 255, 204, 0.1)',
                    'rgba(204, 0, 255, 0.1)'
                ];
                return colors[Math.floor(Math.random() * colors.length)];
            }
            
            // Initialize the board
            function initializeBoard() {
                board = [];
                boardElement.innerHTML = '';
                
                // Create 6x7 board
                for (let row = 0; row < 6; row++) {
                    board[row] = [];
                    for (let col = 0; col < 7; col++) {
                        board[row][col] = null;
                        
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.row = row;
                        cell.dataset.col = col;
                        
                        // Add column click handler
                        cell.addEventListener('click', () => handleColumnClick(col));
                        
                        boardElement.appendChild(cell);
                    }
                }
                
                updateIntelligenceDisplay();
            }
            
            // Color selection
            colorOptions.forEach(option => {
                option.addEventListener('click', function() {
                    if (gameActive) return;
                    
                    colorOptions.forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');
                    playerColor = this.dataset.color;
                    playerAvatar.style.backgroundColor = playerColor;
                });
            });
            
            // Difficulty selection
            difficultyButtons.forEach(button => {
                button.addEventListener('click', function() {
                    difficultyButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    difficulty = this.dataset.difficulty;
                    
                    // Update AI level based on difficulty
                    switch(difficulty) {
                        case 'easy':
                            aiLevel = 1;
                            aiIntelligence = 10;
                            break;
                        case 'medium':
                            aiLevel = 2;
                            aiIntelligence = 30;
                            break;
                        case 'hard':
                            aiLevel = 3;
                            aiIntelligence = 60;
                            break;
                        case 'impossible':
                            aiLevel = 4;
                            aiIntelligence = 90;
                            break;
                    }
                    
                    aiLevelElement.textContent = aiLevel;
                    updateIntelligenceDisplay();
                });
            });
            
            // Handle column click
            function handleColumnClick(col) {
                if (!gameActive || currentPlayer !== 'player') return;
                
                // Find the lowest empty row in the selected column
                const row = findLowestEmptyRow(col);
                
                if (row === -1) {
                    gameStatusElement.innerHTML = "<span>Column is full! Choose another cosmic path!</span>";
                    return;
                }
                
                // Place player's disc
                placeDisc(row, col, playerColor);
                
                // Check for win
                if (checkWin(row, col, playerColor)) {
                    endGame('player');
                    return;
                }
                
                // Check for draw
                if (checkDraw()) {
                    endGame('draw');
                    return;
                }
                
                // Switch to robot's turn
                currentPlayer = 'robot';
                gameStatusElement.innerHTML = "<span>NOVA AI is calculating cosmic moves...</span>";
                
                // Robot makes a move after a short delay
                setTimeout(robotMove, 800);
            }
            
            // Find the lowest empty row in a column
            function findLowestEmptyRow(col) {
                for (let row = 5; row >= 0; row--) {
                    if (board[row][col] === null) {
                        return row;
                    }
                }
                return -1; // Column is full
            }
            
            // Place a disc on the board
            function placeDisc(row, col, color) {
                board[row][col] = color;
                
                const cellIndex = row * 7 + col;
                const cell = boardElement.children[cellIndex];
                
                const disc = document.createElement('div');
                disc.className = 'disc falling';
                disc.style.backgroundColor = color;
                
                cell.appendChild(disc);
                
                // Create particle effect
                createParticles(cell, color);
                
                // Remove animation class after animation completes
                setTimeout(() => {
                    disc.classList.remove('falling');
                }, 600);
            }
            
            // Create particle explosion effect
            function createParticles(element, color) {
                for (let i = 0; i < 20; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.backgroundColor = color;
                    particle.style.left = (element.offsetLeft + 37) + 'px';
                    particle.style.top = (element.offsetTop + 37) + 'px';
                    
                    document.body.appendChild(particle);
                    
                    // Random direction and distance
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 25 + Math.random() * 80;
                    const targetX = Math.cos(angle) * distance;
                    const targetY = Math.sin(angle) * distance;
                    
                    // Animate particle
                    particle.animate([
                        { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                        { transform: `translate(${targetX}px, ${targetY}px) scale(0)`, opacity: 0 }
                    ], {
                        duration: 1000 + Math.random() * 500,
                        easing: 'cubic-bezier(0.1, 0.8, 0.2, 1)'
                    }).onfinish = () => {
                        particle.remove();
                    };
                }
            }
            
            // Robot makes a move
            function robotMove() {
                if (!gameActive) return;
                
                let col;
                
                // Different strategies based on difficulty
                switch(difficulty) {
                    case 'easy':
                        col = makeEasyMove();
                        break;
                    case 'medium':
                        col = makeMediumMove();
                        break;
                    case 'hard':
                        col = makeHardMove();
                        break;
                    case 'impossible':
                        col = makeImpossibleMove();
                        break;
                }
                
                if (col === -1) {
                    // Fallback to random move if no strategic move found
                    const validColumns = getValidColumns();
                    if (validColumns.length > 0) {
                        col = validColumns[Math.floor(Math.random() * validColumns.length)];
                    } else {
                        // No valid moves - draw
                        endGame('draw');
                        return;
                    }
                }
                
                const row = findLowestEmptyRow(col);
                placeDisc(row, col, robotColor);
                
                // Check for win
                if (checkWin(row, col, robotColor)) {
                    endGame('robot');
                    return;
                }
                
                // Check for draw
                if (checkDraw()) {
                    endGame('draw');
                    return;
                }
                
                // Switch back to player's turn
                currentPlayer = 'player';
                gameStatusElement.innerHTML = "<span>Your cosmic turn! Make your move!</span>";
            }
            
            // Easy AI - mostly random with basic win/block logic
            function makeEasyMove() {
                // Check for immediate win
                let col = findWinningMove(robotColor);
                if (col !== -1) return col;
                
                // Sometimes block player (50% chance)
                if (Math.random() < 0.5) {
                    col = findWinningMove(playerColor);
                    if (col !== -1) return col;
                }
                
                // Otherwise random
                return -1;
            }
            
            // Medium AI - always blocks and uses basic strategy
            function makeMediumMove() {
                // Check for immediate win
                let col = findWinningMove(robotColor);
                if (col !== -1) return col;
                
                // Block player's winning moves
                col = findWinningMove(playerColor);
                if (col !== -1) return col;
                
                // Prefer center columns
                const centerColumns = [3, 2, 4, 1, 5, 0, 6];
                const validColumns = getValidColumns();
                for (let c of centerColumns) {
                    if (validColumns.includes(c)) return c;
                }
                
                return -1;
            }
            
            // Hard AI - uses minimax with limited depth
            function makeHardMove() {
                // Check for immediate win
                let col = findWinningMove(robotColor);
                if (col !== -1) return col;
                
                // Block player's winning moves
                col = findWinningMove(playerColor);
                if (col !== -1) return col;
                
                // Use minimax with depth 4
                return minimax(4, -Infinity, Infinity, true)[1];
            }
            
            // Impossible AI - uses advanced minimax with deeper search
            function makeImpossibleMove() {
                // Check for immediate win
                let col = findWinningMove(robotColor);
                if (col !== -1) return col;
                
                // Block player's winning moves
                col = findWinningMove(playerColor);
                if (col !== -1) return col;
                
                // Use minimax with depth 6 (more strategic)
                return minimax(6, -Infinity, Infinity, true)[1];
            }
            
            // Get all valid columns (not full)
            function getValidColumns() {
                const validColumns = [];
                for (let col = 0; col < 7; col++) {
                    if (findLowestEmptyRow(col) !== -1) {
                        validColumns.push(col);
                    }
                }
                return validColumns;
            }
            
            // Find a winning move for a player
            function findWinningMove(color) {
                for (let col = 0; col < 7; col++) {
                    const row = findLowestEmptyRow(col);
                    if (row === -1) continue;
                    
                    // Temporarily place disc
                    board[row][col] = color;
                    
                    // Check if this move would win
                    if (checkWin(row, col, color)) {
                        // Undo temporary placement
                        board[row][col] = null;
                        return col;
                    }
                    
                    // Undo temporary placement
                    board[row][col] = null;
                }
                
                return -1; // No winning move found
            }
            
            // Minimax algorithm with alpha-beta pruning
            function minimax(depth, alpha, beta, maximizingPlayer) {
                const validColumns = getValidColumns();
                
                // Terminal conditions
                if (depth === 0 || validColumns.length === 0) {
                    return [evaluateBoard(), -1];
                }
                
                if (maximizingPlayer) {
                    let maxEval = -Infinity;
                    let bestCol = validColumns[0];
                    
                    for (let col of validColumns) {
                        const row = findLowestEmptyRow(col);
                        board[row][col] = robotColor;
                        
                        const evaluation = minimax(depth - 1, alpha, beta, false)[0];
                        board[row][col] = null;
                        
                        if (evaluation > maxEval) {
                            maxEval = evaluation;
                            bestCol = col;
                        }
                        
                        alpha = Math.max(alpha, evaluation);
                        if (beta <= alpha) break;
                    }
                    
                    return [maxEval, bestCol];
                } else {
                    let minEval = Infinity;
                    let bestCol = validColumns[0];
                    
                    for (let col of validColumns) {
                        const row = findLowestEmptyRow(col);
                        board[row][col] = playerColor;
                        
                        const evaluation = minimax(depth - 1, alpha, beta, true)[0];
                        board[row][col] = null;
                        
                        if (evaluation < minEval) {
                            minEval = evaluation;
                            bestCol = col;
                        }
                        
                        beta = Math.min(beta, evaluation);
                        if (beta <= alpha) break;
                    }
                    
                    return [minEval, bestCol];
                }
            }
            
            // Evaluate the board state
            function evaluateBoard() {
                let score = 0;
                
                // Evaluate all possible 4-in-a-row sequences
                for (let row = 0; row < 6; row++) {
                    for (let col = 0; col < 7; col++) {
                        // Check horizontal
                        if (col <= 3) {
                            score += evaluateWindow(
                                [board[row][col], board[row][col+1], board[row][col+2], board[row][col+3]]
                            );
                        }
                        
                        // Check vertical
                        if (row <= 2) {
                            score += evaluateWindow(
                                [board[row][col], board[row+1][col], board[row+2][col], board[row+3][col]]
                            );
                        }
                        
                        // Check diagonal (positive slope)
                        if (row <= 2 && col <= 3) {
                            score += evaluateWindow(
                                [board[row][col], board[row+1][col+1], board[row+2][col+2], board[row+3][col+3]]
                            );
                        }
                        
                        // Check diagonal (negative slope)
                        if (row >= 3 && col <= 3) {
                            score += evaluateWindow(
                                [board[row][col], board[row-1][col+1], board[row-2][col+2], board[row-3][col+3]]
                            );
                        }
                    }
                }
                
                return score;
            }
            
            // Evaluate a window of 4 cells
            function evaluateWindow(window) {
                let score = 0;
                let robotCount = 0;
                let playerCount = 0;
                let emptyCount = 0;
                
                for (let cell of window) {
                    if (cell === robotColor) robotCount++;
                    else if (cell === playerColor) playerCount++;
                    else emptyCount++;
                }
                
                // Score based on the number of pieces in the window
                if (robotCount === 4) score += 100;
                else if (robotCount === 3 && emptyCount === 1) score += 5;
                else if (robotCount === 2 && emptyCount === 2) score += 2;
                
                if (playerCount === 4) score -= 100;
                else if (playerCount === 3 && emptyCount === 1) score -= 4;
                
                return score;
            }
            
            // Check for a win
            function checkWin(row, col, color) {
                // Directions: horizontal, vertical, diagonal up, diagonal down
                const directions = [
                    [0, 1],  // right
                    [1, 0],  // down
                    [1, 1],  // down-right
                    [1, -1]  // down-left
                ];
                
                for (const [dx, dy] of directions) {
                    let count = 1; // starting with the current disc
                    
                    // Check in positive direction
                    for (let i = 1; i < 4; i++) {
                        const newRow = row + i * dx;
                        const newCol = col + i * dy;
                        
                        if (
                            newRow >= 0 && newRow < 6 &&
                            newCol >= 0 && newCol < 7 &&
                            board[newRow][newCol] === color
                        ) {
                            count++;
                        } else {
                            break;
                        }
                    }
                    
                    // Check in negative direction
                    for (let i = 1; i < 4; i++) {
                        const newRow = row - i * dx;
                        const newCol = col - i * dy;
                        
                        if (
                            newRow >= 0 && newRow < 6 &&
                            newCol >= 0 && newCol < 7 &&
                            board[newRow][newCol] === color
                        ) {
                            count++;
                        } else {
                            break;
                        }
                    }
                    
                    if (count >= 4) {
                        highlightWinningCells(row, col, color, dx, dy);
                        return true;
                    }
                }
                
                return false;
            }
            
            // Highlight winning cells
            function highlightWinningCells(row, col, color, dx, dy) {
                // Find all cells in the winning line
                const winningCells = [{row, col}];
                
                // Check in positive direction
                for (let i = 1; i < 4; i++) {
                    const newRow = row + i * dx;
                    const newCol = col + i * dy;
                    
                    if (
                        newRow >= 0 && newRow < 6 &&
                        newCol >= 0 && newCol < 7 &&
                        board[newRow][newCol] === color
                    ) {
                        winningCells.push({row: newRow, col: newCol});
                    } else {
                        break;
                    }
                }
                
                // Check in negative direction
                for (let i = 1; i < 4; i++) {
                    const newRow = row - i * dx;
                    const newCol = col - i * dy;
                    
                    if (
                        newRow >= 0 && newRow < 6 &&
                        newCol >= 0 && newCol < 7 &&
                        board[newRow][newCol] === color
                    ) {
                        winningCells.push({row: newRow, col: newCol});
                    } else {
                        break;
                    }
                }
                
                // Highlight the winning cells
                winningCells.forEach(cell => {
                    const cellIndex = cell.row * 7 + cell.col;
                    const cellElement = boardElement.children[cellIndex];
                    const disc = cellElement.querySelector('.disc');
                    if (disc) {
                        disc.classList.add('winning');
                    }
                });
            }
            
            // Check for a draw
            function checkDraw() {
                for (let row = 0; row < 6; row++) {
                    for (let col = 0; col < 7; col++) {
                        if (board[row][col] === null) {
                            return false;
                        }
                    }
                }
                return true;
            }
            
            // Create victory celebration
            function createVictoryCelebration() {
                victoryCelebration.style.display = 'block';
                victoryCelebration.innerHTML = '';
                
                for (let i = 0; i < 150; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.backgroundColor = getRandomConfettiColor();
                    confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                    confetti.style.width = Math.random() * 15 + 5 + 'px';
                    confetti.style.height = Math.random() * 15 + 5 + 'px';
                    
                    victoryCelebration.appendChild(confetti);
                    
                    // Animate confetti
                    confetti.animate([
                        { 
                            transform: `translateY(-100px) rotate(0deg)`,
                            opacity: 1
                        },
                        { 
                            transform: `translateY(${window.innerHeight}px) rotate(${Math.random() * 720}deg)`,
                            opacity: 0
                        }
                    ], {
                        duration: 2000 + Math.random() * 2000,
                        delay: Math.random() * 1000,
                        easing: 'cubic-bezier(0.1, 0.8, 0.2, 1)'
                    });
                }
                
                // Hide celebration after 5 seconds
                setTimeout(() => {
                    victoryCelebration.style.display = 'none';
                }, 5000);
            }
            
            function getRandomConfettiColor() {
                const colors = [
                    '#ff00cc', '#00ccff', '#00ffcc', '#ffcc00', '#cc00ff', '#ff3300',
                    '#ffffff', '#ff9999', '#99ff99', '#9999ff'
                ];
                return colors[Math.floor(Math.random() * colors.length)];
            }
            
            // End the game
            function endGame(winner) {
                gameActive = false;
                
                if (winner === 'player') {
                    gameStatusElement.innerHTML = "<span>🌟 COSMIC VICTORY! You've mastered the universe! 🌟</span>";
                    playerWins++;
                    playerWinsElement.textContent = playerWins;
                    
                    // Increase AI intelligence when player wins
                    aiIntelligence = Math.min(100, aiIntelligence + 5);
                    if (aiIntelligence % 20 === 0) {
                        aiLevel++;
                        aiLevelElement.textContent = aiLevel;
                    }
                    
                    updateIntelligenceDisplay();
                    createVictoryCelebration();
                    
                } else if (winner === 'robot') {
                    gameStatusElement.innerHTML = "<span>💥 COSMIC DEFEAT! NOVA AI has outmaneuvered you! 💥</span>";
                    robotWins++;
                    playerLosses++;
                    robotWinsElement.textContent = robotWins;
                    playerLossesElement.textContent = playerLosses;
                    
                } else {
                    gameStatusElement.innerHTML = "<span>⚡ The cosmic forces are in balance! It's a draw! ⚡</span>";
                }
            }
            
            // Update AI intelligence display
            function updateIntelligenceDisplay() {
                intelligenceLevelElement.style.width = `${aiIntelligence}%`;
                
                let intelligenceText = "NOVA is learning cosmic strategies...";
                if (aiIntelligence < 30) {
                    intelligenceText = "NOVA is a cosmic novice";
                } else if (aiIntelligence < 60) {
                    intelligenceText = "NOVA is developing cosmic awareness";
                } else if (aiIntelligence < 90) {
                    intelligenceText = "NOVA has achieved cosmic intelligence";
                } else {
                    intelligenceText = "NOVA has become a cosmic entity!";
                }
                
                intelligenceTextElement.textContent = `${intelligenceText} (${aiIntelligence}%)`;
            }
            
            // Start game
            startButton.addEventListener('click', function() {
                initializeBoard();
                gameActive = true;
                currentPlayer = 'player';
                gameStatusElement.innerHTML = "<span>Cosmic battle initiated! Your move, explorer!</span>";
            });
            
            // Reset game
            resetButton.addEventListener('click', function() {
                initializeBoard();
                gameActive = false;
                gameStatusElement.innerHTML = "<span>Select your cosmic color and begin the challenge!</span>";
            });
            
            // Initialize the board on page load
            initializeBoard();
        });
    </script>
